# Set TRON2_MJCF_PATH to the official DACH_TRON2A robot_grasper.xml.
env:
  _target_: capx.envs.tasks.tron2.cube_lift.Tron2CubeLiftCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level:
      _target_: capx.envs.simulators.tron2_mujoco.Tron2MujocoEnv
      task: cube_lift
      backend: mujoco
      privileged: true
      enable_render: false
    apis: [Tron2ControlApi]
    multi_turn_prompt: |
      Executed code:
      {executed_code}
      Console output and TRON2 episode feedback:
      {console_stdout}
      Execution errors:
      {console_stderr}
      If the task is incomplete, use the current poses and failure reason to plan a new attempt.

record_video: false
save_multiturn_prompts: true
output_dir: ./outputs/tron2/cube_lift_s1
trials: 20
num_workers: 1
